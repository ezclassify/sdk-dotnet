# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # CI refuses any third-party package published inside a seven-day
      # window (scripts/check-dependency-age.mjs). Without a matching cooldown
      # here, Dependabot proposes a release the moment it lands and the pull
      # request fails its own quarantine gate.
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # Same seven-day wait for action releases: a tag pushed minutes ago has
      # had no time to be reported if it was compromised.
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0
