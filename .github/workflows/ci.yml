name: CI

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only checks.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Spec and generator integrity. The vendored OpenAPI and gen.mjs are
      # checked against the hashes MANIFEST.json records before anything is
      # installed. The expected values are read inside the shell rather than
      # through a workflow expression, because a pull request can edit the
      # MANIFEST and an expression would paste its text into this script.
      - name: Verify spec and generator hashes
        run: |
          set -euo pipefail
          read -r EXPECTED_SPEC_SHA256 EXPECTED_GEN_SHA256 < <(python3 -c "
          import json
          m = json.load(open('vendor/spec/MANIFEST.json'))
          print(m['openapiSha256'], m['generators']['dotnet']['sha256'])
          ")
          for pair in "vendor/spec/openapi.yaml:$EXPECTED_SPEC_SHA256" "scripts/gen.mjs:$EXPECTED_GEN_SHA256"; do
            file=${pair%%:*}
            expected=${pair#*:}
            if ! printf '%s' "$expected" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "ERROR: MANIFEST carries no valid hash for $file: $expected"
              exit 1
            fi
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "ERROR: $file does not match MANIFEST"
              echo "  MANIFEST: $expected"
              echo "  actual:   $actual"
              exit 1
            fi
          done

      - name: Set up Node.js 22
        uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474 # v7.0.0
        with:
          node-version: "22"

      # Both need only Node, so they run before the .NET install.
      - name: Check architecture ownership
        run: make check-architecture

      # Non-mutating: covers every shipped generated source and both canonical
      # inputs (OpenAPI plus the JSON Schema bundle).
      - name: Verify committed generated models
        run: make check-generated

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore EzClassify.sln

      # Reads the restore graph just written and runs before anything builds, so
      # a package's build targets never run before it clears. Fails closed when
      # nuget.org cannot be read.
      - name: Dependency quarantine
        run: make check-dependency-age

      # Resolves the transitive production closure and checks each package's
      # nuspec license against the allowlist in scripts/gen-notices.py.
      - name: Dependency license compliance
        run: python3 scripts/gen-notices.py check

      # Refresh after a dependency change with: python3 scripts/gen-notices.py notices
      - name: THIRD-PARTY-NOTICES.md is current
        run: python3 scripts/gen-notices.py notices --check

      - name: Check formatting
        run: dotnet format EzClassify.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EzClassify.sln --no-restore --configuration Release

      # Includes PublicApiSurfaceTests against the same Release assemblies.
      - name: Test
        run: dotnet test EzClassify.sln --no-build --configuration Release --filter "Category!=Live" --logger "console;verbosity=normal"

      # Runs examples/server-tour against the assemblies built above. CI has no
      # server, so this exercises client construction plus the PingAsync error
      # path and requires a clean exit through the no-server branch.
      - name: Example compiles and handles an unreachable server
        run: |
          set -euo pipefail
          OUT=$(dotnet run --project examples/server-tour --configuration Release --no-build)
          printf '%s\n' "$OUT"
          printf '%s' "$OUT" | grep -Eq 'Tour Complete|No server'

      # A check that rewrites a tracked file would hide a stale generated
      # source behind a green run.
      - name: Working tree is clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  # Release-only work. The release train accepts a workflow_dispatch run of
  # this workflow with full=true on the exact commit when this job succeeds.
  full:
    name: full
    needs: ci
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      # The shipped package must pack from a clean tree and carry both target
      # frameworks, which the test project (net10.0 only) never exercises.
      - name: Pack the NuGet and check its target frameworks
        run: |
          set -euo pipefail
          dotnet pack EzClassify.Rest.Client/EzClassify.Rest.Client.csproj --configuration Release --output "$RUNNER_TEMP/nupkg"
          LISTING=$(unzip -l "$RUNNER_TEMP"/nupkg/EzClassify.Rest.Client.*.nupkg)
          printf '%s\n' "$LISTING"
          printf '%s' "$LISTING" | grep -q 'lib/netstandard2.0/EzClassify.Rest.Client.dll'
          printf '%s' "$LISTING" | grep -q 'lib/net8.0/EzClassify.Rest.Client.dll'
